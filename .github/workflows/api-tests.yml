name: API Test Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
  workflow_dispatch:

jobs:

  # =========================
  # SMOKE TESTS
  # =========================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run Smoke Tests
        run: mvn clean test -DsuiteXmlFile=src/test/resources/testng-smoke.xml

      - name: Upload Smoke Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: target/allure-results


  # =========================
  # REGRESSION TESTS
  # =========================
  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: smoke-tests

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run Regression Tests
        run: mvn clean test -DsuiteXmlFile=src/test/resources/testng-regression.xml

      - name: Upload Regression Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression
          path: target/allure-results


  # =========================
  # GENERATE ALLURE REPORT
  # =========================
  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Smoke Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-smoke

      - name: Download Regression Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-regression
          path: allure-regression

      - name: Merge Results
        run: |
          mkdir -p target/allure-results
          cp -r allure-smoke/* target/allure-results/ || true
          cp -r allure-regression/* target/allure-results/ || true

      - name: Generate Allure Report (Maven)
        run: mvn io.qameta.allure:allure-maven:report

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin


  # =========================
  # DEPLOY TO GITHUB PAGES
  # =========================
  deploy-report:
    name: Deploy Allure Report
    runs-on: ubuntu-latest
    needs: allure-report

    steps:
      - name: Download Allure Report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: report