name: API Test Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Run SMOKE
      - name: Run Smoke Tests
        run: mvn clean test -DsuiteXmlFile=src/test/resources/testng-smoke.xml

      - name: Save Smoke Results
        run: |
          mkdir smoke-results
          cp -r target/allure-results/. smoke-results/

      # Run REGRESSION
      - name: Run Regression Tests
        run: mvn clean test -DsuiteXmlFile=src/test/resources/testng-regression.xml

      - name: Save Regression Results
        run: |
          mkdir regression-results
          cp -r target/allure-results/. regression-results/

      # Merge results
      - name: Merge Results
        run: |
          mkdir -p target/allure-results
          cp -r smoke-results/. target/allure-results/ || true
          cp -r regression-results/. target/allure-results/ || true

      # Generate report
      - name: Generate Allure Report
        run: mvn io.qameta.allure:allure-maven:report

      # Prepare GitHub Pages
      - name: Prepare Pages
        run: |
          mkdir public
          cp -r target/site/allure-maven-plugin/* public/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4