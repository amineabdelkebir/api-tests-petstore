name: API Test Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
  workflow_dispatch:

jobs:

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run Smoke Tests
        run: mvn clean test -DsuiteXmlFile=src/test/resources/testng-smoke.xml

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: target/allure-results


  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: smoke-tests

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run Regression Tests
        run: mvn clean test -DsuiteXmlFile=src/test/resources/testng-regression.xml

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression
          path: target/allure-results


  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Smoke results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-smoke
          path: target/allure-results

      - name: Download Regression results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-regression
          path: target/allure-results

      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y allure

      - name: Generate report
        run: allure generate target/allure-results -o allure-report --clean

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
